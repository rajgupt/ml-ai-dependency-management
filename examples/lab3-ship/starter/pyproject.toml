[project]
name = "churnkit"
version = "0.1.0"
description = "Lab 3 - churnkit, as it lands on your desk on Monday morning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    # Pinned to an old release on purpose -- see Lab 3 Step 4 (the upgrade
    # ritual). `uv lock --upgrade-package scikit-learn` is the fix.
    "scikit-learn>=1.3",
]

# EXTRAS ship with the package. A user opts in: `pip install churnkit[gpu]`.
[project.optional-dependencies]
gpu = ["torch>=2.6"]

# The console script. This is what your Dockerfile CMD and your scheduler call.
[project.scripts]
churn-train = "churnkit.cli:main"

# GROUPS (PEP 735) never ship. Only people working on this repo see them.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
