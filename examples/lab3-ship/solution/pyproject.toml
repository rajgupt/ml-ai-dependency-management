[project]
name = "churnkit"
version = "0.1.0"
description = "Lab 3 - churnkit, shipped: GPU/CPU split, containers, CI, an upgrade ritual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

# EXTRAS ship with the package. A user opts in: `pip install churnkit[gpu]`.
[project.optional-dependencies]
gpu = ["torch>=2.6"]

# The console script. This is what your Dockerfile CMD and your scheduler call.
[project.scripts]
churn-train = "churnkit.cli:main"

# GROUPS (PEP 735) never ship. Only people working on this repo see them.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- Lab 3 Step 1: one lockfile, laptops and the GPU cluster --------------
#
# PyPI's own `torch` wheel is a CPU-only build. `explicit = true` keeps each
# index scoped to the packages that name it below -- without that, uv would
# consult both indexes for *every* dependency in the project, which is both
# slower and a dependency-confusion risk.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Marker split: laptops (macOS/Apple Silicon) resolve the CPU wheel, the
# training cluster (Linux/x86_64) resolves the CUDA build. One `uv lock` run
# records both in the same uv.lock; `uv sync` on either machine only ever
# installs the one that matches it.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
