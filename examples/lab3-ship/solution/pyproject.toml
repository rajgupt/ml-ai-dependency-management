[project]
name = "churnkit"
version = "0.1.0"
description = "Lab 3 - churnkit, shipped: GPU/CPU split, containers, CI, an upgrade ritual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

# EXTRAS ship with the package. A user opts in: `pip install churnkit[gpu]`.
[project.optional-dependencies]
gpu = ["torch>=2.6"]

# The console script. This is what your Dockerfile CMD and your scheduler call.
[project.scripts]
churn-train = "churnkit.cli:main"

# GROUPS (PEP 735) never ship. Only people working on this repo see them.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lab 3 Step 1 (optional / go deeper) adds a torch CPU/GPU index split here --
# two `[[tool.uv.index]]` entries plus a `[tool.uv.sources]` marker table
# pointing torch at PyTorch's own `cpu`/`cu128` indexes. It is intentionally
# NOT wired up in this checked-in solution: `uv lock` needs outbound access to
# download.pytorch.org, which most CI runners have but this course's own
# sandboxed authoring/build environment does not (an explicit proxy
# allowlist blocks it -- see docs/labs/lab-3.md Step 1 for the exact recipe
# and that sharp edge). Read Step 1 for the full, real config; this file
# keeps the plain `gpu` extra from Lab 2 so `uv lock`/`uv sync --locked` stay
# genuinely runnable in every environment that builds this repo.
